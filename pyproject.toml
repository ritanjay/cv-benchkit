[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-benchkit"
version = "0.2.3"
description = "Computer-vision benchmark toolkit: bbox format converters, dataset translators, and evaluation metrics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Uday Raj", email = "rajuday6002@gmail.com" }]
keywords = ["computer-vision", "bbox", "coco", "yolo", "voc", "iou", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
]

[project.scripts]
cv-benchkit = "cv_benchkit.cli:main"

[project.urls]
Homepage = "https://github.com/udayraj1238/cv-benchkit"
Repository = "https://github.com/udayraj1238/cv-benchkit"
Issues = "https://github.com/udayraj1238/cv-benchkit/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cv_benchkit --cov-report=term-missing"
